  <title>Dashboard Administrasi GKY Singkawang</title>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#092f55; --deep:#061f39; --blue:#174d78; --gold:#d5ad57;
      --mist:#f4f6f8; --ink:#17212b; --muted:#71808c; --line:#e2e8ed;
      --success:#2f7d5f; --danger:#ad4141;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--mist)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.65}
    .app-shell{width:100%;min-height:100vh}
    .serif{font-family:"Fraunces",serif}
    .welcome{
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:20px;
      overflow:hidden;position:relative;
      background:radial-gradient(circle at 15% 18%,#28618e,transparent 30%),linear-gradient(135deg,#03182d,#092f55 58%,#0d426d);
    }
    .welcome-inner{position:relative;z-index:1;width:min(100%,440px);text-align:center;color:#fff;background:rgba(6, 31, 57, 0.85);padding:25px;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,0.3);backdrop-filter:blur(10px);border:1px solid rgba(231, 196, 116, 0.2)}
    .logo-halo{width:90px;height:90px;margin:auto;padding:6px;border-radius:50%;background:transparent}
    .logo-halo img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block;background:white;}
    .gold-rule{width:72px;height:1px;background:#e7c474;margin:15px auto}
    .primary,.secondary,.danger-button{
      border:0;border-radius:10px;padding:11px 15px;font-weight:700;display:inline-flex;
      gap:7px;align-items:center;justify-content:center;transition:.2s ease;width:100%;
    }
    .primary{background:var(--gold);color:var(--navy)}
    .primary:hover{background:#e5c475;transform:translateY(-1px)}
    .secondary{background:#fff;color:#153b5b;border:1px solid #d8e2e8}
    .secondary:hover{background:#f7fafc}
    .danger-button{background:#fdf0f0;color:#9e3030;border:1px solid #f0cccc}
    .danger-button:hover{background:#f9dddd}
    .dashboard{display:none;min-height:100vh}
    .dashboard.active{display:flex}
    .sidebar{
      width:265px;position:fixed;inset:0 auto 0 0;background:var(--deep);padding:22px 14px;
      z-index:30;color:#d6e5f0;overflow-y:auto;transition:transform .3s ease;
    }
    .brand{display:flex;gap:11px;align-items:center;padding:0 8px 21px;border-bottom:1px solid #ffffff20}
    .brand img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:9px;padding:3px}
    .nav-link{
      width:100%;border:0;border-radius:10px;background:transparent;color:#b8ccdc;padding:11px 12px;
      text-align:left;display:flex;gap:11px;align-items:center;font-size:14px;
    }
    .nav-link:hover,.nav-link.active{color:#fff;background:#ffffff15;box-shadow:inset 3px 0 var(--gold)}
    .main-area{width:100%;margin-left:265px;padding:24px;transition:margin .3s ease}
    .topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}
    .page-title{margin:0;font-family:"Fraunces",serif;font-size:26px}
    .view{display:none}
    .view.active{display:block}
    .panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #122b3c0c}
    .panel{padding:18px}
    .card{padding:16px}
    .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .metric{border-top:3px solid #bd8d38}
    .metric p{margin:0;color:#6f7e89;font-size:12px}
    .metric strong{display:block;font-size:24px;color:#173247;margin-top:6px}
    .content-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:16px}
    .panel-title{margin:0;font-size:16px;font-weight:700}
    .panel-sub{color:#788690;font-size:12px;margin:4px 0 0}
    .empty{padding:30px 12px;text-align:center;color:#7b8993;font-size:13px}
    .toolbar{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:14px 0}
    .field{width:100%;border:1px solid #dbe4e9;border-radius:9px;padding:10px 12px;background:#fff;color:#34434e;outline:none;font-size:14px}
    .field:focus{border-color:#3971a0;box-shadow:0 0 0 3px #3971a022}
    .search{width:100%;max-width:280px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .form-group{display:flex;flex-direction:column;gap:5px}
    .form-group label{font-size:12px;font-weight:700;color:#42535f;text-align:left}
    .full{grid-column:1/-1}
    .textarea{min-height:80px;resize:vertical}
    
    .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:5px}
    .data-table{width:100%;min-width:750px;border-collapse:collapse}
    .data-table th{text-align:left;padding:10px 12px;background:#f7f9fa;text-transform:uppercase;letter-spacing:.05em;font-size:11px;color:#697883}
    .data-table td{padding:11px 12px;border-top:1px solid #edf1f3;font-size:13px;color:#344652}
    .status{font-size:11px;padding:3px 7px;border-radius:999px;background:#edf3f7;color:#31546c;display:inline-block}
    .link-btn{border:0;background:transparent;padding:4px 6px;color:#174d78;font-weight:700;font-size:12px}
    .link-btn.danger{color:#a53535}
    .mobile{display:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px}
    .modal-layer{display:none;position:fixed;z-index:70;inset:0;background:#03172b99;padding:16px;align-items:center;justify-content:center}
    .modal-layer.show{display:flex}
    .modal{width:min(100%,540px);max-height:90vh;overflow-y:auto;background:#fff;border-radius:16px;padding:20px}
    .modal-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}
    .close{border:0;background:#edf2f5;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
    .toast{position:fixed;right:16px;bottom:16px;z-index:90;display:none;align-items:center;gap:9px;padding:12px 16px;background:#173f35;color:#fff;border-radius:10px;box-shadow:0 14px 30px #001b1533;font-size:13px;font-weight:700}
    .toast.show{display:flex;animation:toastIn .25s ease}
    @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:1024px){
      .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .content-grid{grid-template-columns:1fr}
    }
    @media(max-width:820px){
      .sidebar{transform:translateX(-100%);box-shadow:5px 0 25px rgba(0,0,0,0.3)}
      .sidebar.open{transform:translateX(0)}
      .main-area{margin-left:0;padding:16px}
      .mobile{display:inline-flex}
    }
    @media(max-width:540px){
      .grid4{grid-template-columns:1fr}
      .form-grid{grid-template-columns:1fr}
      .toolbar{flex-direction:column;align-items:stretch}
      .search{max-width:100%!important}
      #member-commission-filter{max-width:100%!important}
      .page-title{font-size:22px}
      .modal{padding:16px}
    }
  </style>
</head>
